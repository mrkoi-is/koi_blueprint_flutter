name: koi_blueprint_flutter
version: 0.1.0
publish_to: none
description: Koi Flutter monorepo blueprint
repository: https://github.com/mrkoi-is/koi_blueprint_flutter
homepage: https://github.com/mrkoi-is/koi_blueprint_flutter
issue_tracker: https://github.com/mrkoi-is/koi_blueprint_flutter/issues

environment:
  sdk: '>=3.11.0 <4.0.0'

workspace:
  - apps/koi_admin_app
  - packages/koi_api_bootstrap
  - packages/koi_auth
  - packages/koi_core
  - packages/koi_domain
  - packages/koi_ui

dev_dependencies:
  analyzer: 9.0.0
  flutter_lints: ^6.0.0
  melos: ^8.5.0

melos:
  command:
    bootstrap:
      runPubGetInParallel: true
      usePubspecOverrides: false

  scripts:
    get:
      description: 初始化所有包依赖
      exec: "$MELOS_ROOT_PATH/tool/flutterw pub get"

    analyze:
      description: 分析全部 package 和 app
      exec: "$MELOS_ROOT_PATH/tool/dartw analyze --fatal-infos"

    format:check:
      description: 检查格式化
      exec: "$MELOS_ROOT_PATH/tool/dartw format --output=none --set-exit-if-changed ."

    format:fix:
      description: 自动格式化
      exec: "$MELOS_ROOT_PATH/tool/dartw format ."

    fix:apply:
      description: 自动修复 lint
      exec: "$MELOS_ROOT_PATH/tool/dartw fix --apply"

    generate:
      description: 运行代码生成
      exec: "$MELOS_ROOT_PATH/tool/dartw run build_runner build"
      packageFilters:
        dependsOn: build_runner

    generate:watch:
      description: watch 模式代码生成
      exec: "$MELOS_ROOT_PATH/tool/dartw run build_runner watch"
      packageFilters:
        dependsOn: build_runner

    test:
      description: 运行全部测试
      run: "$MELOS_ROOT_PATH/tool/flutterw test"
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test

    coverage:
      description: 检查每个 workspace 成员的测试与合并行覆盖率
      run: "$MELOS_ROOT_PATH/scripts/check_coverage.sh"

    clean:
      description: 清理工作区
      exec: "$MELOS_ROOT_PATH/tool/flutterw clean"

    precommit:
      description: 提交前检查
      run: >-
        "$MELOS_ROOT_PATH/tool/melos" run format:check --no-select &&
        "$MELOS_ROOT_PATH/scripts/check_generated.sh" &&
        "$MELOS_ROOT_PATH/tool/melos" run analyze --no-select &&
        "$MELOS_ROOT_PATH/tool/melos" run test --no-select
