name: koi_blueprint_flutter
version: 0.1.0
publish_to: none
description: Koi Flutter monorepo blueprint
repository: https://github.com/mrkoi-is/koi_blueprint_flutter
homepage: https://github.com/mrkoi-is/koi_blueprint_flutter
issue_tracker: https://github.com/mrkoi-is/koi_blueprint_flutter/issues

environment:
  sdk: '>=3.13.0 <4.0.0'

workspace:
  - apps/koi_admin_app
  - packages/koi_api_bootstrap
  - packages/koi_auth
  - packages/koi_core
  - packages/koi_domain
  - packages/koi_ui
  - packages/koi_modules
  - examples/starter_app
  - examples/ui_lab
  - examples/workbench_app
  - examples/minimal_module
  - examples/feature_lab
  - examples/module_showcase
  - examples/module_showcase/packages/showcase_contracts
  - examples/module_showcase/modules/alpha
  - examples/module_showcase/modules/beta

dev_dependencies:
  analyzer: 14.4.0
  yaml: ^3.1.3
  flutter_lints: ^6.0.0
  melos: ^8.9.0

melos:
  command:
    bootstrap:
      runPubGetInParallel: true
      usePubspecOverrides: false

  scripts:
    get:
      run: python blueprint.py check bootstrap
    analyze:
      run: python blueprint.py check analyze
    format:check:
      run: python blueprint.py check format-check
    format:fix:
      run: python blueprint.py check format
    generate:
      run: python blueprint.py check generate
    generate:watch:
      exec:
        command: dart run build_runner watch
      packageFilters:
        dependsOn: build_runner
    test:
      run: python blueprint.py check test
    coverage:
      run: python blueprint.py check coverage
    precommit:
      run: python blueprint.py validate
