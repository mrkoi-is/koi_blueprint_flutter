name: workbench_app
description: Persistent cross-platform workspace and optional blueprint template
publish_to: none
resolution: workspace
version: 0.1.0+1
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.2'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  koi_core:
  koi_ui:
  file_selector: 1.1.0
  cross_file: 0.3.5+5
  path_provider: 2.1.6
  web: 1.1.1
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.16.1
  riverpod_generator: 4.0.9
  go_router_builder: ^4.4.0
  freezed: 4.0.2
  json_serializable: 6.14.1
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fixtures/
