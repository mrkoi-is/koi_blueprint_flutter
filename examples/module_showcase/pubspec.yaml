name: module_showcase
description: Two independent modules composed by a stable host router.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: ^18.0.2
  riverpod_annotation: 4.0.7
  koi_core:
  koi_modules:
  koi_ui:
  showcase_contracts:
  showcase_alpha:
  showcase_beta:

dev_dependencies:
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  riverpod_generator: 4.0.9

flutter:
  generate: true
  uses-material-design: true
