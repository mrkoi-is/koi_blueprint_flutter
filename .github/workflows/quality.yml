name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          ./tool/flutterw --version
          ./tool/dartw --version
          expected_flutter="$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')"
          ./tool/flutterw --version | head -n 1 | grep -F "Flutter $expected_flutter"

      - name: Validate workspace
        env:
          COVERAGE_THRESHOLD: '60'
        run: ./scripts/validate_workspace.sh
