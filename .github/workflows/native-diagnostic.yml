name: PR16 native diagnostics

on:
  push:
    branches: [codex/pr16-native-diagnostics]

permissions:
  contents: read

jobs:
  windows-runtime:
    strategy:
      fail-fast: false
      matrix:
        suite: [browser]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Normalize pinned SDK CanvasKit URL handling
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import os
          sdk = Path(os.environ['FLUTTER_ROOT'])
          path = sdk / 'packages/flutter_tools/lib/src/test/flutter_web_platform.dart'
          original = path.read_text(encoding='utf-8')
          patches = [
              ('shelf.Response _localCanvasKitHandler(shelf.Request request) {\n    final String fullPath = _fileSystem.path.fromUri(request.url);',
               'shelf.Response _localCanvasKitHandler(shelf.Request request) {\n    final String fullPath = request.url.path;'),
              ('shelf.Response _wrapperHandler(shelf.Request request) {\n    final String path = _fileSystem.path.fromUri(request.url);',
               'shelf.Response _wrapperHandler(shelf.Request request) {\n    final String path = request.url.path;'),
          ]
          updated = original
          for before, after in patches:
              if updated.count(before) == 1:
                  updated = updated.replace(before, after)
              elif updated.count(after) != 1:
                  raise SystemExit('Unexpected Flutter browser handler; stop rather than patch unknown tooling')
          if updated != original:
              path.write_text(updated, encoding='utf-8')
              for name in ('flutter_tools.snapshot', 'flutter_tools.stamp'):
                  (sdk / 'bin/cache' / name).unlink(missing_ok=True)
              print('Applied isolated CI SDK URL fixes for CanvasKit and test selector (Flutter issue #192069)')
          else:
              print('CI SDK already has the browser URL fixes')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate Windows workbench
        run: python blueprint.py create ci_blueprint --output "${{ runner.temp }}/koi-windows-diagnostic" --org com.example --template workbench --platforms web,windows
      - name: Windows browser smoke
        if: matrix.suite == 'browser'
        working-directory: ${{ runner.temp }}/koi-windows-diagnostic/apps/ci_blueprint_app
        run: |
          flutter test --no-pub --verbose --reporter expanded --file-reporter json:browser-tests.json --platform chrome test/browser 2>&1 | Tee-Object -FilePath browser-runtime.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows native smoke
        if: matrix.suite == 'native'
        working-directory: ${{ runner.temp }}/koi-windows-diagnostic/apps/ci_blueprint_app
        run: |
          flutter test --no-pub --verbose --reporter expanded --file-reporter json:native-runtime-tests.json --dart-define=KOI_TEST_NATIVE_AUDIO_OUTPUT=null -d windows integration_test/workbench_runtime_test.dart 2>&1 | Tee-Object -FilePath native-runtime.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostics-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/koi-windows-diagnostic/apps/ci_blueprint_app/*runtime.log
            ${{ runner.temp }}/koi-windows-diagnostic/apps/ci_blueprint_app/*tests.json
          if-no-files-found: ignore
