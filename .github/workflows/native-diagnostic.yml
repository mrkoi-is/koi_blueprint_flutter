name: PR16 native diagnostics

on:
  push:
    branches: [codex/pr16-native-diagnostics]

permissions:
  contents: read

jobs:
  graphics-capability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe the actual media_kit_video OpenGL requirements
        run: swift tool/macos_media_preflight.swift
