include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "tool/capabilities/recipes/**"
    # Local acceptance evidence is not product source. Fixture pubspecs
    # under docs/validation must not fail `dart analyze --fatal-infos`.
    - "docs/validation/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    always_use_package_imports: true
    prefer_single_quotes: true
    sort_pub_dependencies: false
